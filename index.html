<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Red Crime</title>
  <meta name="description" content="Red Crime — 2B gizlilik ve hırsızlık oyunu. Hedefi uyandırmadan, süre dolmadan en değerli ganimeti kamyona yükle!" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Uygulama simgesi: tarayıcı sekmesi, masaüstü kısayolu / yüklenen uygulama -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#8f1020" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loader">
    <img class="app-icon" src="assets/logo.png" alt="Red Crime" />
    <div class="sub">Yükleniyor...</div>
  </div>

  <script>
    // Yükleme yazısı kayıtlı dilde (ilk açılışta her iki dil)
    (function () {
      var sub = document.querySelector('#loader .sub');
      try {
        var d = JSON.parse(localStorage.getItem('redcrime.save.v1') || 'null');
        var st = d && d.settings;
        if (!st || !st.langChosen) sub.textContent = 'Yükleniyor · Loading...';
        else if (st.lang === 'en') { sub.textContent = 'Loading...'; document.documentElement.lang = 'en'; }
      } catch (e) {}
    })();
  </script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/lang_en.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/touch.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/render/particles.js"></script>
  <script src="js/render/camera.js"></script>
  <script src="js/render/draw.js"></script>
  <script src="js/render/human.js"></script>
  <script src="js/render/backgrounds.js"></script>
  <script src="js/render/truck.js"></script>
  <script src="js/world/itemdefs.js"></script>
  <script src="js/world/furniture.js"></script>
  <script src="js/world/physics.js"></script>
  <script src="js/entities/item.js"></script>
  <script src="js/world/security.js"></script>
  <script src="js/world/heat.js"></script>
  <script src="js/world/levelgen.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/entities/resident.js"></script>
  <script src="js/entities/dog.js"></script>
  <script src="js/render/decor.js"></script>
  <script src="js/render/worldrender.js"></script>
  <script src="js/render/lighting.js"></script>
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/tutorial.js"></script>
  <script src="js/ui/minigames.js"></script>
  <script src="js/ui/dragloot.js"></script>
  <script src="js/scenes/intro.js"></script>
  <script src="js/scenes/menu.js"></script>
  <script src="js/scenes/levelselect.js"></script>
  <script src="js/scenes/darkweb.js"></script>
  <script src="js/scenes/planning.js"></script>
  <script src="js/scenes/finale.js"></script>
  <script src="js/scenes/briefing.js"></script>
  <script src="js/scenes/truckride.js"></script>
  <script src="js/scenes/heist.js"></script>
  <script src="js/scenes/results.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
